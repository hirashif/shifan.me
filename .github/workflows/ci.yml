name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: install playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The tests read secrets from .dev.vars (gitignored, local only) and the
      # dev server loads it as its env. CI gets throwaway random values so the
      # suite runs the same way it does locally, with no real secrets involved.
      - name: write throwaway .dev.vars
        run: |
          {
            echo "GITHUB_CLIENT_ID=ci-test-client"
            echo "GITHUB_CLIENT_SECRET=$(openssl rand -hex 16)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "USAGE_TOKEN=$(openssl rand -hex 32)"
          } > .dev.vars

      # Local D1 starts empty in CI; create the plot table the same way prod was.
      - name: apply D1 migrations locally
        run: pnpm exec wrangler d1 migrations apply shifan-plot --local

      - name: build
        run: pnpm build

      - name: test
        run: pnpm test
